name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    working-directory: Ferrum
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        configuration: [Debug]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Ferrum/global.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build only (no executable tests)
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration '${{ matrix.configuration }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ferrum-${{ matrix.os }}-${{ matrix.configuration }}
          path: Ferrum/artifacts/package/
          include-hidden-files: true
